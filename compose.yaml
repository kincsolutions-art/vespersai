# Local development infrastructure. Compose reads ./.env for ${...} interpolation
# only; it does NOT read a service's `env_file` for interpolation, so a value that
# must be operator-configurable has to come from exactly one named source.
#
# The split, deliberately:
#   * `environment:` below owns deployment topology — service names, the declared
#     environment, telemetry. These override `env_file` by design.
#   * `.env.dashboard` (the dashboard's `env_file`) owns WorkOS operator
#     configuration, including the callback URL and the CSRF origin allowlist.
#     Compose must not also set those keys, or the file would be silently ignored.
#   * ./.env supplies the backend's WorkOS values and VESPERS_ENVIRONMENT.
name: vespers-development
x-backend: &backend
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  environment: &environment
    VESPERS_ENVIRONMENT: ${VESPERS_ENVIRONMENT:-development}
    VESPERS_DATABASE_URL: postgresql+psycopg://vespers_app:local_app_only@postgres:5432/vespers_development
    VESPERS_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://vespers_dbos:local_dbos_only@postgres:5432/vespers_dbos_development
    # Empty by default: protected routes fail closed, health checks keep working.
    VESPERS_WORKOS_CLIENT_ID: ${VESPERS_WORKOS_CLIENT_ID:-}
    VESPERS_WORKOS_API_KEY: ${VESPERS_WORKOS_API_KEY:-}
    VESPERS_WORKOS_ISSUERS: ${VESPERS_WORKOS_ISSUERS:-[]}
    VESPERS_WORKOS_AUDIENCE: ${VESPERS_WORKOS_AUDIENCE:-}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_PASSWORD: local_admin_only
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *backend
    environment:
      VESPERS_ENVIRONMENT: ${VESPERS_ENVIRONMENT:-development}
      VESPERS_MIGRATION_DATABASE_URL: postgresql+psycopg://vespers_owner:local_owner_only@postgres:5432/vespers_development
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app/backend
    restart: "no"
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
    develop:
      watch:
        - path: ./backend
          action: rebuild
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    command: ["python", "-m", "backend.workflows.worker"]
    volumes:
      - ./backend:/app/backend
    develop:
      watch:
        - path: ./backend
          action: rebuild
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workflows.readiness"]
      interval: 3s
      timeout: 5s
      retries: 10
  dashboard:
    build: ./apps/dashboard
    ports: ["127.0.0.1:3000:3000"]
    # Topology only. These deliberately override .env.dashboard: the API address
    # is the internal service name, and the declared environment must match the
    # backend's rather than being set per service.
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      VESPERS_API_BASE_URL: http://api:8000
      VESPERS_ENVIRONMENT: ${VESPERS_ENVIRONMENT:-development}
    # The single source for WorkOS dashboard configuration, including
    # NEXT_PUBLIC_WORKOS_REDIRECT_URI and VESPERS_ALLOWED_ORIGINS. Nothing above
    # repeats those keys, so editing this file actually takes effect.
    # Server-side only, and optional: without it the dashboard renders the
    # "sign-in unavailable" state instead of failing to start.
    env_file:
      - path: .env.dashboard
        required: false
    develop:
      watch:
        - path: ./apps/dashboard
          action: rebuild
          ignore:
            - node_modules/
            - .next/
            - .env*
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
