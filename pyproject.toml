[project]
name = "vespers"
version = "0.1.0"
description = "Telegram assistant backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "composio==0.21.1",
    "dbos==2.31.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic-ai-slim[dbos,openai]==2.43.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.53",
    "tavily-python==0.8.3",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
